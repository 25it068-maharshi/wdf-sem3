<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Student Registration</h1><form id="registration"><label>Name <input id="name" required></label><label>Email <input id="email" type="email" required></label><label>Mobile <input id="mobile" type="tel" required></label><label>Password <input id="password" type="password" required></label><label>Confirm Password <input id="confirm" type="password" required></label><label>Course <select id="course" required><option value="">Select</option><option>B.Tech IT</option><option>B.Tech CE</option></select></label><label>Year <select id="year"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label><input type="checkbox" id="terms"> I accept terms</label><button>Submit</button></form><p id="message" role="alert"></p></main><script src="script.js"></script></body></html>
